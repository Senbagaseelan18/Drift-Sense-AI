<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <style>
      .bg { fill: #0B0D17; }
      .text-large { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1px; }
      .text-small { font-family: 'Courier New', monospace; font-size: 12px; fill: #A0ABC0; }
      .text-math { font-family: 'Courier New', monospace; font-size: 14px; fill: #00F0FF; }
      
      .box { stroke: #1F2937; stroke-width: 2; fill: #111827; rx: 4; }
      
      /* Data Streams */
      .stream-ref { stroke: #00F0FF; stroke-width: 2; fill: none; stroke-dasharray: 4; animation: flow-r 2s infinite linear; }
      @keyframes flow-r { 100% { stroke-dashoffset: -8; } }
      
      .stream-search { stroke: #FF3366; stroke-width: 2; fill: none; stroke-dasharray: 4; animation: flow-s 2s infinite linear; }
      @keyframes flow-s { 100% { stroke-dashoffset: -8; } }

      .stream-joint { stroke: #39FF14; stroke-width: 2; fill: none; stroke-dasharray: 4; animation: flow-j 2s infinite linear; }
      @keyframes flow-j { 100% { stroke-dashoffset: -8; } }

      /* Transformations */
      /* Image -> Features */
      .img { fill: #1A202C; stroke: #2D3748; }
      .feat { fill: none; stroke: #00F0FF; stroke-width: 1; opacity: 0.5; }
      .feat-s { fill: none; stroke: #FF3366; stroke-width: 1; opacity: 0.5; }
      
      /* FPN merging scales */
      .fpn-l1 { stroke: #A0ABC0; stroke-width: 1; fill: none; }
      
      /* Heatmap */
      .hm { fill: url(#hm-grad); }
      
      /* Probability Cloud (Soft-Argmax) */
      .prob { fill: #39FF14; animation: pulse-prob 2s infinite alternate; }
      @keyframes pulse-prob { 0% { opacity: 0.4; r: 20; } 100% { opacity: 0.8; r: 10; } }

      /* The coordinate */
      .coord { fill: #39FF14; }
    </style>

    <radialGradient id="hm-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="30%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="500" />

  <!-- LABELS -->
  <text class="text-large" x="100" y="50" text-anchor="middle">IMAGE</text>
  <text class="text-large" x="300" y="50" text-anchor="middle">RESNET50</text>
  <text class="text-large" x="500" y="50" text-anchor="middle">FPN</text>
  <text class="text-large" x="700" y="50" text-anchor="middle">CORRELATION</text>
  <text class="text-large" x="850" y="50" text-anchor="middle">HEATMAP</text>
  <text class="text-large" x="1000" y="50" text-anchor="middle">SOFT-ARGMAX</text>
  <text class="text-large" x="1100" y="50" text-anchor="middle">OUTPUT</text>

  <!-- REFERENCE STREAM (Top) -->
  <g transform="translate(0, 150)">
    <!-- Image -->
    <rect class="img" x="60" y="0" width="80" height="80" rx="4" />
    <circle cx="100" cy="40" r="10" fill="#00F0FF" opacity="0.8" />
    <text class="text-small" x="100" y="-10" text-anchor="middle">Reference</text>

    <!-- Path -->
    <path class="stream-ref" d="M 140 40 L 260 40" />

    <!-- ResNet Features -->
    <rect class="feat" x="270" y="-10" width="60" height="60" />
    <rect class="feat" x="280" y="0" width="60" height="60" />
    <rect class="feat" x="290" y="10" width="60" height="60" />
    
    <!-- Path -->
    <path class="stream-ref" d="M 350 40 L 460 40" />

    <!-- FPN Features (Multi-scale fusion) -->
    <rect class="feat" x="470" y="10" width="40" height="40" />
    <rect class="feat" x="480" y="15" width="30" height="30" />
    <rect class="feat" x="490" y="20" width="20" height="20" />
    <line class="fpn-l1" x1="480" y1="50" x2="490" y2="40" />
    
    <!-- Path to Correlation -->
    <path class="stream-ref" d="M 510 40 Q 600 40 680 90" />
  </g>

  <!-- SEARCH STREAM (Bottom) -->
  <g transform="translate(0, 350)">
    <!-- Image -->
    <rect class="img" x="60" y="-80" width="80" height="80" rx="4" />
    <circle cx="120" cy="-20" r="10" fill="#FF3366" opacity="0.8" />
    <circle cx="80" cy="-60" r="10" fill="#FF3366" opacity="0.4" />
    <text class="text-small" x="100" y="20" text-anchor="middle">Search</text>

    <!-- Path -->
    <path class="stream-search" d="M 140 -40 L 260 -40" />

    <!-- ResNet Features -->
    <rect class="feat-s" x="270" y="-70" width="60" height="60" />
    <rect class="feat-s" x="280" y="-60" width="60" height="60" />
    <rect class="feat-s" x="290" y="-50" width="60" height="60" />

    <!-- Path -->
    <path class="stream-search" d="M 350 -40 L 460 -40" />

    <!-- FPN Features -->
    <rect class="feat-s" x="470" y="-50" width="40" height="40" />
    <rect class="feat-s" x="480" y="-45" width="30" height="30" />
    <rect class="feat-s" x="490" y="-40" width="20" height="20" />
    <line class="fpn-l1" x1="480" y1="-10" x2="490" y2="-20" />

    <!-- Path to Correlation -->
    <path class="stream-search" d="M 510 -40 Q 600 -40 680 -90" />
  </g>

  <!-- CORRELATION & REGRESSION (Center) -->
  <g transform="translate(700, 250)">
    <!-- Correlation Module -->
    <rect class="box" x="-30" y="-30" width="60" height="60" rx="30" />
    <text class="text-math" x="0" y="5" text-anchor="middle" font-size="20">⊗</text>
    <text class="text-small" x="0" y="50" text-anchor="middle">Dense Match</text>
    
    <!-- Path to Heatmap -->
    <path class="stream-joint" d="M 30 0 L 110 0" />

    <!-- Heatmap -->
    <rect class="box" x="110" y="-40" width="80" height="80" />
    <rect class="hm" x="120" y="-30" width="60" height="60" />
    <text class="text-small" x="150" y="60" text-anchor="middle">Similarity Field</text>
    
    <!-- Path to Soft-Argmax -->
    <path class="stream-joint" d="M 190 0 L 250 0" />

    <!-- Soft-Argmax -->
    <rect class="box" stroke="#39FF14" x="250" y="-40" width="100" height="80" rx="10" />
    <circle class="prob" cx="300" cy="0" />
    <circle cx="300" cy="0" r="3" fill="#FFF" />
    <text class="text-small" x="300" y="60" text-anchor="middle">Prob. Cloud</text>
    
    <!-- Path to Output -->
    <path class="stream-joint" d="M 350 0 L 390 0" />

    <!-- Output (x,y) -->
    <text class="text-large coord" x="400" y="5">(x, y)</text>
    <text class="text-small" x="420" y="30" text-anchor="middle">Sub-pixel</text>
  </g>

</svg>
