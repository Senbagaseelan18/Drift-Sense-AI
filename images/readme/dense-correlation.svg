<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <style>
      .bg { fill: #0B0D17; }
      .text-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 800; fill: #FFFFFF; letter-spacing: 2px; }
      .text-small { font-family: 'Courier New', monospace; font-size: 12px; fill: #A0ABC0; font-weight: bold; }
      .text-cyan { fill: #00F0FF; }
      
      .box { stroke: #1F2937; stroke-width: 2; fill: #111827; rx: 4; }
      
      /* Pattern */
      .pat { fill: #1A202C; stroke: #2D3748; stroke-width: 1; rx: 2; }
      .pat-dot { fill: #2D3748; }

      /* Scan Window */
      .scan-window { fill: rgba(0,240,255,0.1); stroke: #00F0FF; stroke-width: 2; animation: s-win 12s infinite; }
      @keyframes s-win {
        0%, 5% { transform: translate(320px, 120px); opacity: 0; }
        10% { transform: translate(320px, 120px); opacity: 1; }
        20% { transform: translate(520px, 120px); }
        30% { transform: translate(720px, 120px); }
        40% { transform: translate(320px, 220px); }
        50% { transform: translate(520px, 220px); } /* CORRECT MATCH */
        60% { transform: translate(720px, 220px); }
        70%, 100% { transform: translate(720px, 220px); opacity: 0; }
      }

      /* Score Labels */
      .sc { opacity: 0; animation-duration: 12s; animation-iteration-count: infinite; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; text-anchor: middle; }
      
      .s-1 { animation-name: show-1; fill: #FF3366; } /* low */
      @keyframes show-1 { 10%, 65% { opacity: 1; } 0%, 9%, 66%, 100% { opacity: 0; } }
      
      .s-2 { animation-name: show-2; fill: #FF9900; } /* med */
      @keyframes show-2 { 20%, 65% { opacity: 1; } 0%, 19%, 66%, 100% { opacity: 0; } }
      
      .s-3 { animation-name: show-3; fill: #FF3366; } /* low */
      @keyframes show-3 { 30%, 65% { opacity: 1; } 0%, 29%, 66%, 100% { opacity: 0; } }
      
      .s-4 { animation-name: show-4; fill: #FF9900; } /* med */
      @keyframes show-4 { 40%, 65% { opacity: 1; } 0%, 39%, 66%, 100% { opacity: 0; } }
      
      .s-5 { animation-name: show-5; fill: #39FF14; font-size: 16px; } /* HIGH (Correct) */
      @keyframes show-5 { 50%, 65% { opacity: 1; } 0%, 49%, 66%, 100% { opacity: 0; } }
      
      .s-6 { animation-name: show-6; fill: #FF3366; } /* low */
      @keyframes show-6 { 60%, 65% { opacity: 1; } 0%, 59%, 66%, 100% { opacity: 0; } }

      /* Heatmap Transformation */
      .heatmap-bg { opacity: 0; fill: url(#hm-grad); animation: hm-show 12s infinite; }
      @keyframes hm-show { 70%, 90% { opacity: 1; } 0%, 69%, 91%, 100% { opacity: 0; } }
      
      /* Final Match Box */
      .best-match { opacity: 0; fill: rgba(57,255,20,0.2); stroke: #39FF14; stroke-width: 3; animation: bm-show 12s infinite cubic-bezier(0.34, 1.56, 0.64, 1); transform-origin: 560px 260px; }
      @keyframes bm-show {
        0%, 75% { opacity: 0; transform: scale(1.5); }
        80%, 90% { opacity: 1; transform: scale(1); }
        95%, 100% { opacity: 0; }
      }
      
      .best-text { opacity: 0; animation: bt-show 12s infinite; }
      @keyframes bt-show { 80%, 90% { opacity: 1; } 0%, 79%, 91%, 100% { opacity: 0; } }

    </style>
    
    <!-- Heatmap Gradient centered on the correct match (520, 220, w80, h80 -> center 560, 260) -->
    <radialGradient id="hm-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#39FF14" />
      <stop offset="20%" stop-color="#FF9900" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <rect class="bg" width="1200" height="400" />

  <!-- The Reference (What we are looking for) -->
  <g transform="translate(80, 150)">
    <rect class="box" width="100" height="100" stroke="#00F0FF" />
    <text class="text-title text-cyan" x="50" y="-15" text-anchor="middle">REFERENCE</text>
    
    <!-- Unique Target Pattern -->
    <rect class="pat" x="20" y="20" width="60" height="20" />
    <rect class="pat" x="20" y="60" width="60" height="20" />
    <circle class="pat-dot" cx="30" cy="30" r="4" fill="#00F0FF" />
    <circle class="pat-dot" cx="70" cy="70" r="4" fill="#00F0FF" />
  </g>

  <!-- Connective arrow -->
  <g transform="translate(200, 200)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#1F2937" stroke-width="2" stroke-dasharray="4" />
    <polygon points="80,0 70,-5 70,5" fill="#1F2937" />
  </g>

  <!-- The Search Field -->
  <g transform="translate(300, 50)">
    <rect class="box" width="520" height="300" stroke="#1F2937" />
    <text class="text-title" style="fill:#FFF;" x="260" y="-15" text-anchor="middle">SEARCH FIELD</text>
    
    <!-- Candidate grid: 3x2 grid of patterns spaced out -->
    <!-- Pattern 1 (Row 1, Col 1) -->
    <g transform="translate(20, 70)">
      <rect class="pat" x="10" y="10" width="60" height="20" />
      <rect class="pat" x="10" y="50" width="60" height="20" />
      <!-- Slightly wrong dots -->
      <circle class="pat-dot" cx="20" cy="20" r="4" />
    </g>
    <!-- Pattern 2 (Row 1, Col 2) -->
    <g transform="translate(220, 70)">
      <rect class="pat" x="10" y="10" width="60" height="20" />
      <rect class="pat" x="10" y="50" width="60" height="20" />
      <circle class="pat-dot" cx="70" cy="20" r="4" />
    </g>
    <!-- Pattern 3 (Row 1, Col 3) -->
    <g transform="translate(420, 70)">
      <rect class="pat" x="10" y="10" width="60" height="20" />
      <rect class="pat" x="10" y="50" width="60" height="20" />
      <circle class="pat-dot" cx="40" cy="40" r="4" />
    </g>
    
    <!-- Pattern 4 (Row 2, Col 1) -->
    <g transform="translate(20, 170)">
      <rect class="pat" x="10" y="10" width="60" height="20" />
      <rect class="pat" x="10" y="50" width="60" height="20" />
      <circle class="pat-dot" cx="20" cy="60" r="4" />
    </g>
    <!-- Pattern 5 (Row 2, Col 2) - THE CORRECT MATCH -->
    <g transform="translate(220, 170)">
      <rect class="pat" x="10" y="10" width="60" height="20" />
      <rect class="pat" x="10" y="50" width="60" height="20" />
      <circle class="pat-dot" cx="20" cy="20" r="4" />
      <circle class="pat-dot" cx="60" cy="60" r="4" />
    </g>
    <!-- Pattern 6 (Row 2, Col 3) -->
    <g transform="translate(420, 170)">
      <rect class="pat" x="10" y="10" width="60" height="20" />
      <rect class="pat" x="10" y="50" width="60" height="20" />
      <circle class="pat-dot" cx="40" cy="60" r="4" />
    </g>

    <!-- Heatmap Overlay (Appears Later) -->
    <rect class="heatmap-bg" x="20" y="20" width="480" height="260" />

  </g>

  <!-- Animated Elements -->
  
  <!-- Scan Window -->
  <rect class="scan-window" width="80" height="80" rx="4" />

  <!-- Scores -->
  <text class="sc s-1" x="360" y="100">LOW</text>
  <text class="sc s-2" x="560" y="100">MED</text>
  <text class="sc s-3" x="760" y="100">LOW</text>
  <text class="sc s-4" x="360" y="200">MED</text>
  <text class="sc s-5" x="560" y="200">HIGH</text>
  <text class="sc s-6" x="760" y="200">LOW</text>

  <!-- Final Best Match Lock -->
  <rect class="best-match" x="520" y="220" width="80" height="80" rx="4" />
  
  <g class="best-text" transform="translate(560, 180)">
    <rect x="-60" y="-15" width="120" height="20" fill="rgba(11,13,23,0.9)" stroke="#39FF14" stroke-width="1" rx="2" />
    <text class="text-small" style="fill:#39FF14;" x="0" y="0" text-anchor="middle">BEST MATCH</text>
    <line x1="0" y1="5" x2="0" y2="40" stroke="#39FF14" stroke-width="1" />
  </g>

</svg>
