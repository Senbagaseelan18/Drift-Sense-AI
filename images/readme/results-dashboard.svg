<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <style>
      .bg { fill: #0B0D17; }
      .text-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #FFFFFF; letter-spacing: 1px;}
      .text-val { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 36px; font-weight: 900; }
      .text-sub { font-family: 'Courier New', monospace; font-size: 13px; fill: #A0ABC0; }
      
      .box { fill: #111827; stroke: #1F2937; stroke-width: 2; rx: 6; }
      
      /* Accuracy Tolerance Ring */
      .tol-ring { fill: rgba(57,255,20,0.05); stroke: #39FF14; stroke-width: 2; animation: tol 10s infinite cubic-bezier(0.4, 0, 0.2, 1); transform-origin: center; }
      @keyframes tol {
        0%, 40% { r: 50px; } /* 5px threshold visually */
        50%, 90% { r: 90px; } /* 10px threshold visually */
        100% { r: 50px; }
      }
      
      .tol-text-1 { opacity: 1; animation: tt1 10s infinite; }
      @keyframes tt1 { 0%, 40% { opacity: 1; } 45%, 100% { opacity: 0; } }
      .tol-text-2 { opacity: 0; animation: tt2 10s infinite; }
      @keyframes tt2 { 0%, 45% { opacity: 0; } 50%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
      
      /* Error Cluster */
      .err-radius { fill: rgba(255,215,0,0.1); stroke: #FFD700; stroke-dasharray: 4; stroke-width: 1; animation: er-pulse 4s infinite alternate; }
      @keyframes er-pulse { 0% { r: 23px; } 100% { r: 25px; } }

      /* Latency Scan */
      .lat-scan { stroke: #B026FF; stroke-width: 4; stroke-linecap: round; animation: l-scan 2.167s infinite linear; }
      @keyframes l-scan { 0% { stroke-dashoffset: 200; } 100% { stroke-dashoffset: -200; } }

      .text-green { fill: #39FF14; }
      .text-yellow { fill: #FFD700; }
      .text-purple { fill: #B026FF; }
      .text-cyan { fill: #00F0FF; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="500" />

  <!-- Panel 1: Accuracy Physical Proof -->
  <g transform="translate(50, 50)">
    <rect class="box" stroke="#39FF14" width="350" height="400" />
    <text class="text-title text-green" x="20" y="35">LOCALIZATION ACCURACY</text>
    
    <g transform="translate(175, 200)">
      <!-- The expanding tolerance ring -->
      <circle class="tol-ring" cx="0" cy="0" />
      <circle cx="0" cy="0" r="3" fill="#FFF" /> <!-- True Center -->
      
      <!-- 29 Points inside 5px -->
      <!-- We'll hardcode some scatter points inside r=50 -->
      <g fill="#00F0FF">
        <circle cx="10" cy="-20" r="2" /><circle cx="-15" cy="30" r="2" /><circle cx="25" cy="15" r="2" />
        <circle cx="-30" cy="-10" r="2" /><circle cx="5" cy="40" r="2" /><circle cx="-40" cy="5" r="2" />
        <circle cx="20" cy="-35" r="2" /><circle cx="-5" cy="-45" r="2" /><circle cx="35" cy="25" r="2" />
        <circle cx="-25" cy="-30" r="2" /><circle cx="40" cy="-15" r="2" /><circle cx="-10" cy="20" r="2" />
        <circle cx="15" cy="35" r="2" /><circle cx="-35" cy="25" r="2" /><circle cx="30" cy="-5" r="2" />
        <circle cx="0" cy="15" r="2" /><circle cx="10" cy="10" r="2" /><circle cx="-20" cy="-15" r="2" />
        <circle cx="20" cy="20" r="2" /><circle cx="-15" cy="-25" r="2" /><circle cx="5" cy="-30" r="2" />
        <circle cx="25" cy="-20" r="2" /><circle cx="-25" cy="15" r="2" /><circle cx="15" cy="-10" r="2" />
        <circle cx="-10" cy="-5" r="2" /><circle cx="30" cy="10" r="2" /><circle cx="-5" cy="10" r="2" />
        <circle cx="0" cy="-25" r="2" /><circle cx="10" cy="25" r="2" />
      </g>
      
      <!-- The 1 outlier point (outside 5px, inside 10px) -->
      <circle cx="65" cy="-45" r="2" fill="#FF3366" />
    </g>
    
    <g class="tol-text-1" transform="translate(175, 330)">
      <text class="text-val text-green" x="0" y="0" text-anchor="middle">96.67%</text>
      <text class="text-sub" style="fill:#FFF;" x="0" y="25" text-anchor="middle">29 / 30 Inside ≤ 5px</text>
    </g>
    <g class="tol-text-2" transform="translate(175, 330)">
      <text class="text-val text-green" x="0" y="0" text-anchor="middle">100.0%</text>
      <text class="text-sub" style="fill:#FFF;" x="0" y="25" text-anchor="middle">30 / 30 Inside ≤ 10px</text>
    </g>
  </g>

  <!-- Panel 2: Error Radius -->
  <g transform="translate(430, 50)">
    <rect class="box" stroke="#FFD700" width="350" height="200" />
    <text class="text-title text-yellow" x="20" y="35">MEAN EUCLIDEAN ERROR</text>
    
    <g transform="translate(100, 120)">
      <!-- Mean Error Ring representing 2.34px -->
      <circle class="err-radius" cx="0" cy="0" />
      <circle cx="0" cy="0" r="3" fill="#FFF" />
      <!-- Scatter cluster -->
      <g fill="#A0ABC0">
        <circle cx="5" cy="-8" r="1.5" /><circle cx="-12" cy="5" r="1.5" /><circle cx="15" cy="10" r="1.5" />
        <circle cx="-8" cy="-15" r="1.5" /><circle cx="18" cy="-5" r="1.5" /><circle cx="-2" cy="18" r="1.5" />
        <circle cx="22" cy="12" r="1.5" /><circle cx="-18" cy="-10" r="1.5" /><circle cx="10" cy="-20" r="1.5" />
        <circle cx="25" cy="-15" r="1.5" /> <!-- Near edge of mean -->
      </g>
      
      <line x1="0" y1="0" x2="23" y2="0" stroke="#FFD700" stroke-width="2" />
    </g>
    
    <g transform="translate(250, 110)">
      <text class="text-val text-yellow" x="0" y="0" text-anchor="middle">2.34</text>
      <text class="text-sub" style="fill:#FFF;" x="0" y="25" text-anchor="middle">Pixels Mean</text>
    </g>
  </g>

  <!-- Panel 3: Latency Scan -->
  <g transform="translate(430, 280)">
    <rect class="box" stroke="#B026FF" width="350" height="170" />
    <text class="text-title text-purple" x="20" y="35">GPU INFERENCE SPEED</text>
    
    <g transform="translate(175, 90)">
      <!-- Fast scan track -->
      <rect x="-120" y="-10" width="240" height="20" fill="rgba(176,38,255,0.1)" rx="10" />
      <!-- The scanner -->
      <line class="lat-scan" x1="-100" y1="0" x2="100" y2="0" stroke-dasharray="40 200" />
    </g>
    
    <g transform="translate(175, 140)">
      <text class="text-val text-purple" x="0" y="0" text-anchor="middle">14.2 ms</text>
      <text class="text-sub" style="fill:#FFF;" x="0" y="20" text-anchor="middle">per image pair</text>
    </g>
  </g>

  <!-- Panel 4: Parameters Stack -->
  <g transform="translate(810, 50)">
    <rect class="box" stroke="#00F0FF" width="340" height="400" />
    <text class="text-title text-cyan" x="20" y="35">MODEL CAPACITY</text>
    
    <g transform="translate(170, 180)">
      <!-- Feature Processing Stack Metaphor -->
      <rect x="-80" y="-80" width="160" height="20" fill="rgba(0,240,255,0.2)" stroke="#00F0FF" />
      <rect x="-60" y="-50" width="120" height="20" fill="rgba(0,240,255,0.4)" stroke="#00F0FF" />
      <rect x="-40" y="-20" width="80" height="20" fill="rgba(0,240,255,0.6)" stroke="#00F0FF" />
      <rect x="-20" y="10" width="40" height="20" fill="rgba(0,240,255,0.8)" stroke="#00F0FF" />
      <rect x="-10" y="40" width="20" height="20" fill="#00F0FF" stroke="#00F0FF" />
      
      <line x1="0" y1="-80" x2="0" y2="60" stroke="#FFF" stroke-width="1" stroke-dasharray="2" opacity="0.3" />
    </g>
    
    <g transform="translate(170, 310)">
      <text class="text-val text-cyan" x="0" y="0" text-anchor="middle">24.91 M</text>
      <text class="text-sub" style="fill:#FFF;" x="0" y="25" text-anchor="middle">Total Parameters</text>
      <text class="text-sub" x="0" y="50" text-anchor="middle">~95 MB FP16 Checkpoint</text>
    </g>
  </g>

</svg>
