<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <style>
      .bg { fill: #0B0D17; }
      .text-stage { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 800; fill: #FFFFFF; letter-spacing: 2px; text-anchor: middle; }
      
      .box { fill: #111827; stroke: #1F2937; stroke-width: 2; rx: 8; }
      .stage-line { stroke: #1F2937; stroke-width: 4; stroke-dasharray: 10 5; fill: none; }
      
      /* The target that moves through the stages */
      .target { animation: hero-flow 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes hero-flow {
        0%, 5% { transform: translate(150px, 150px); opacity: 0; }
        10%, 20% { transform: translate(150px, 150px); opacity: 1; }
        
        25%, 45% { transform: translate(450px, 150px); opacity: 1; }
        
        50%, 70% { transform: translate(750px, 150px); opacity: 1; }
        
        75%, 90% { transform: translate(1050px, 150px); opacity: 1; }
        95%, 100% { transform: translate(1050px, 150px); opacity: 0; }
      }

      /* Stage 1: Drift (Target vibrates/shifts) */
      .tgt-drift { animation: t-drift 12s infinite; }
      @keyframes t-drift { 10%, 20% { transform: translate(-10px, 10px); fill: #FF3366; } 0%, 9%, 21%, 100% { fill: #A0ABC0; } }

      /* Stage 2: Search (Target scales down to represent entering wide field) */
      .tgt-search { animation: t-search 12s infinite; }
      @keyframes t-search { 25%, 45% { transform: scale(0.5); stroke: #00F0FF; stroke-width: 2; } }
      
      /* Stage 3: Match (Heatmap pulse around target) */
      .tgt-match { opacity: 0; fill: rgba(0,240,255,0.3); animation: t-match 12s infinite; }
      @keyframes t-match { 50%, 70% { opacity: 1; r: 30px; } 0%, 49%, 71%, 100% { opacity: 0; r: 10px; } }
      
      /* Stage 4: Lock (Precision crosshair) */
      .tgt-lock { opacity: 0; stroke: #39FF14; stroke-width: 3; fill: none; animation: t-lock 12s infinite; }
      @keyframes t-lock { 75%, 95% { opacity: 1; } 0%, 74%, 96%, 100% { opacity: 0; } }
      
      .st-text { opacity: 0.3; transition: opacity 0.3s; animation: txt-glow 12s infinite; }
      @keyframes txt-glow {
        10%, 20% { opacity: 1; } /* stage 1 */
        25%, 45% { opacity: 1; } /* stage 2 */
        50%, 70% { opacity: 1; } /* stage 3 */
        75%, 95% { opacity: 1; } /* stage 4 */
      }
    </style>
  </defs>

  <rect class="bg" width="1200" height="300" />

  <!-- The track -->
  <line class="stage-line" x1="150" y1="150" x2="1050" y2="150" />

  <!-- Stage Backgrounds -->
  <rect class="box" x="70" y="70" width="160" height="160" />
  <rect class="box" x="370" y="70" width="160" height="160" />
  <rect class="box" x="670" y="70" width="160" height="160" />
  <rect class="box" x="970" y="70" width="160" height="160" stroke="#39FF14" fill="rgba(57,255,20,0.05)" />

  <!-- Stage Labels -->
  <text class="text-stage st-text" x="150" y="45" style="animation-delay: 0s;">1. DRIFT</text>
  <text class="text-stage st-text" x="450" y="45" style="animation-delay: -9s;">2. SEARCH</text>
  <text class="text-stage st-text" x="750" y="45" style="animation-delay: -6s;">3. MATCH</text>
  <text class="text-stage st-text" style="fill:#39FF14; animation-delay: -3s;" x="1050" y="45">4. LOCK</text>

  <!-- The Moving Target Group -->
  <g class="target">
    <!-- Base Shape -->
    <g class="tgt-search">
      <!-- Outer box -->
      <rect x="-40" y="-40" width="80" height="80" fill="rgba(16, 24, 39, 0.8)" stroke="#00F0FF" stroke-width="3" rx="8" />
      
      <!-- Inner dot that drifts -->
      <circle class="tgt-drift" cx="0" cy="0" r="10" />
      
      <!-- Match pulse -->
      <circle class="tgt-match" cx="0" cy="0" />
      
      <!-- Final Lock crosshair -->
      <g class="tgt-lock">
        <line x1="-50" y1="0" x2="-20" y2="0" stroke-width="4" />
        <line x1="20" y1="0" x2="50" y2="0" stroke-width="4" />
        <line x1="0" y1="-50" x2="0" y2="-20" stroke-width="4" />
        <line x1="0" y1="20" x2="0" y2="50" stroke-width="4" />
        <circle cx="0" cy="0" r="4" fill="#39FF14" />
      </g>
    </g>
  </g>

</svg>
