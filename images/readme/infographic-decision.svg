<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <style>
      .bg { fill: #0B0D17; }
      .text-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #FFFFFF; letter-spacing: 2px; }
      .text-small { font-family: 'Courier New', monospace; font-size: 14px; fill: #A0ABC0; }
      .text-cyan { fill: #00F0FF; font-weight: bold; }
      
      .box { stroke: #1F2937; stroke-width: 2; fill: none; rx: 4; }
      
      /* Bar animations */
      .bar { fill: #1F2937; transition: all 0.5s; }
      .bar-active { animation: b-act 12s infinite; }
      @keyframes b-act {
        0%, 15% { fill: #1F2937; height: 30px; y: 170px; }
        20%, 85% { fill: #00F0FF; height: 120px; y: 80px; }
        90%, 100% { fill: #1F2937; height: 30px; y: 170px; }
      }

      /* Prob cloud concentration */
      .cloud { fill: rgba(0, 240, 255, 0.2); animation: c-shrink 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes c-shrink {
        0%, 25% { opacity: 0; r: 100px; }
        30% { opacity: 1; r: 100px; }
        45%, 85% { opacity: 1; r: 10px; }
        90%, 100% { opacity: 0; r: 10px; }
      }
      
      /* Coordinate point */
      .coord-pt { fill: #39FF14; opacity: 0; animation: cp-show 12s infinite; }
      @keyframes cp-show { 45%, 85% { opacity: 1; } 0%, 44%, 86%, 100% { opacity: 0; } }

      /* Crosshair lock */
      .lock-cross { stroke: #39FF14; stroke-width: 2; opacity: 0; animation: lc-show 12s infinite; }
      @keyframes lc-show { 50%, 85% { opacity: 1; } 0%, 49%, 86%, 100% { opacity: 0; } }
      
      /* Text readout */
      .readout { opacity: 0; animation: r-show 12s infinite; }
      @keyframes r-show { 55%, 85% { opacity: 1; } 0%, 54%, 86%, 100% { opacity: 0; } }

      /* Connective arrow */
      .arrow { stroke: #39FF14; stroke-width: 2; fill: none; stroke-dasharray: 4; animation: arr 2s infinite linear; opacity: 0; }
      @keyframes arr { 100% { stroke-dashoffset: -8; } }
      .arrow-fade { animation: af 12s infinite; }
      @keyframes af { 35%, 85% { opacity: 1; } 0%, 34%, 86%, 100% { opacity: 0; } }

    </style>
  </defs>

  <rect class="bg" width="1200" height="400" />
  
  <text class="text-title" x="600" y="50" text-anchor="middle">SOFT-ARGMAX DECISION PROCESS</text>
  <text class="text-small" x="600" y="75" text-anchor="middle">Converting spatial probability into a continuous coordinate</text>

  <!-- Left Side: Radar / Candidates -->
  <g transform="translate(150, 150)">
    <rect class="box" x="0" y="0" width="350" height="200" />
    <text class="text-small" x="175" y="180" text-anchor="middle">5 CANDIDATE LOCATIONS</text>
    
    <!-- Candidate Bars -->
    <rect class="bar" x="50" y="160" width="30" height="40" />
    <text class="text-small" x="65" y="220" text-anchor="middle">A</text>
    
    <rect class="bar" x="110" y="140" width="30" height="60" />
    <text class="text-small" x="125" y="220" text-anchor="middle">B</text>
    
    <!-- The Strongest Candidate -->
    <rect class="bar bar-active" x="170" y="170" width="30" height="30" />
    <text class="text-small text-cyan" x="185" y="220" text-anchor="middle">C</text>
    
    <rect class="bar" x="230" y="150" width="30" height="50" />
    <text class="text-small" x="245" y="220" text-anchor="middle">D</text>
    
    <rect class="bar" x="290" y="120" width="30" height="80" />
    <text class="text-small" x="305" y="220" text-anchor="middle">E</text>
  </g>

  <!-- Middle Connection -->
  <g class="arrow-fade">
    <path class="arrow" d="M 520 250 L 680 250" />
  </g>

  <!-- Right Side: Soft-Argmax Concentration -->
  <g transform="translate(700, 150)">
    <rect class="box" x="0" y="0" width="350" height="200" />
    <text class="text-small" x="175" y="180" text-anchor="middle">PROBABILITY CONCENTRATION</text>
    
    <!-- The spatial area -->
    <rect x="20" y="20" width="310" height="130" fill="none" stroke="#1F2937" stroke-width="1" stroke-dasharray="4" />
    
    <!-- The cloud contracting -->
    <circle class="cloud" cx="175" cy="85" r="100" />
    
    <!-- The final coordinate point -->
    <circle class="coord-pt" cx="175" cy="85" r="4" />
    
    <!-- Crosshair locking in -->
    <g class="lock-cross" transform="translate(175, 85)">
      <line x1="-15" y1="0" x2="-5" y2="0" />
      <line x1="5" y1="0" x2="15" y2="0" />
      <line x1="0" y1="-15" x2="0" y2="-5" />
      <line x1="0" y1="5" x2="0" y2="15" />
    </g>
    
    <!-- Coordinate Readout -->
    <g class="readout" transform="translate(200, 50)">
      <rect x="0" y="0" width="120" height="30" fill="#0B0D17" stroke="#39FF14" stroke-width="1" />
      <text class="text-small" style="fill:#39FF14;" x="60" y="20" text-anchor="middle">(x: 517.4, y: 483.8)</text>
    </g>
  </g>

</svg>
