<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <style>
      .bg { fill: #0B0D17; }
      .text-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1px; }
      .text-small { font-family: 'Courier New', monospace; font-size: 16px; fill: #A0ABC0; }
      .text-green { fill: #39FF14; font-weight: bold; }
      
      .box { stroke: #1F2937; stroke-width: 2; fill: #111827; rx: 4; }
      
      /* Conveyor Belt */
      .belt { stroke: #1F2937; stroke-width: 2; stroke-dasharray: 10 5; animation: convey 2s infinite linear; }
      @keyframes convey { 100% { stroke-dashoffset: -15; } }
      
      /* Item moving on the belt */
      .item { animation: moving 16s infinite linear; }
      @keyframes moving {
        0% { transform: translateX(50px); opacity: 0; }
        5% { opacity: 1; transform: translateX(100px); }
        95% { opacity: 1; transform: translateX(1100px); }
        100% { transform: translateX(1150px); opacity: 0; }
      }

      /* Stage Animations */
      /* Stage 1: Raw structures */
      .st1-grid { opacity: 0; animation: s1 16s infinite; }
      @keyframes s1 { 0%, 20% { opacity: 1; } 21%, 100% { opacity: 0; } }
      
      /* Stage 2: Splitting Pair */
      .st2-pair { opacity: 0; animation: s2 16s infinite; }
      @keyframes s2 { 21%, 40% { opacity: 1; } 0%, 20%, 41%, 100% { opacity: 0; } }
      
      /* Stage 3: Degradation */
      .st3-deg { opacity: 0; animation: s3 16s infinite; }
      @keyframes s3 { 41%, 60% { opacity: 1; } 0%, 40%, 61%, 100% { opacity: 0; } }
      
      /* Stage 4: Training/Model */
      .st4-train { opacity: 0; animation: s4 16s infinite; }
      @keyframes s4 { 61%, 80% { opacity: 1; } 0%, 60%, 81%, 100% { opacity: 0; } }
      
      /* Stage 5: Target Lock */
      .st5-lock { opacity: 0; animation: s5 16s infinite; }
      @keyframes s5 { 81%, 95% { opacity: 1; } 0%, 80%, 96%, 100% { opacity: 0; } }

      /* Indicator Lights */
      .light { fill: #1F2937; }
      .l1 { animation: l1-flash 16s infinite; }
      @keyframes l1-flash { 5%, 20% { fill: #00F0FF; } 0%, 4%, 21%, 100% { fill: #1F2937; } }
      .l2 { animation: l2-flash 16s infinite; }
      @keyframes l2-flash { 25%, 40% { fill: #00F0FF; } 0%, 24%, 41%, 100% { fill: #1F2937; } }
      .l3 { animation: l3-flash 16s infinite; }
      @keyframes l3-flash { 45%, 60% { fill: #FF9900; } 0%, 44%, 61%, 100% { fill: #1F2937; } }
      .l4 { animation: l4-flash 16s infinite; }
      @keyframes l4-flash { 65%, 80% { fill: #B026FF; } 0%, 64%, 81%, 100% { fill: #1F2937; } }
      .l5 { animation: l5-flash 16s infinite; }
      @keyframes l5-flash { 85%, 95% { fill: #39FF14; } 0%, 84%, 96%, 100% { fill: #1F2937; } }

    </style>
  </defs>

  <rect class="bg" width="1200" height="400" />

  <!-- Header -->
  <text class="text-title" style="font-size: 28px;" x="50" y="50">END-TO-END DATA FACTORY &amp; PIPELINE</text>

  <!-- The Conveyor Belt -->
  <line class="belt" x1="50" y1="200" x2="1150" y2="200" />
  <line class="belt" x1="50" y1="240" x2="1150" y2="240" />

  <!-- Wafer Gradients and Patterns -->
  <defs>
    <linearGradient id="grad-wafer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="grad-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="grad-lock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Moving Item (Now 2.5x larger and highly detailed) -->
  <g class="item" transform="translate(0, 180)">
    
    <!-- State 1: Raw structure grid (High-res Wafer Die) -->
    <g class="st1-grid">
      <rect x="-40" y="0" width="80" height="80" fill="url(#grad-wafer)" stroke="#00F0FF" stroke-width="2" rx="8" />
      <!-- Silicon grid pattern -->
      <path d="M-20 20 L20 20 M-20 40 L20 40 M-20 60 L20 60 M-20 20 L-20 60 M0 20 L0 60 M20 20 L20 60" stroke="#00F0FF" stroke-width="2" opacity="0.4" />
      <!-- Glowing active nodes -->
      <circle cx="-10" cy="30" r="3" fill="#00F0FF" />
      <circle cx="10" cy="50" r="3" fill="#00F0FF" />
    </g>

    <!-- State 2: Reference + Search Pair -->
    <g class="st2-pair">
      <!-- Search (Large Die) -->
      <rect x="-40" y="0" width="80" height="80" fill="url(#grad-wafer)" stroke="#00F0FF" stroke-width="2" rx="8" />
      <!-- Reference (Small Die extracted) -->
      <rect x="-40" y="-30" width="30" height="30" fill="url(#grad-wafer)" stroke="#39FF14" stroke-width="3" rx="4" />
      <!-- Connection line -->
      <path d="M-25 0 L-25 -15" stroke="#39FF14" stroke-width="2" stroke-dasharray="2 2" />
    </g>

    <!-- State 3: Degraded Pair -->
    <g class="st3-deg">
      <rect x="-40" y="0" width="80" height="80" fill="#1E293B" stroke="#FF9900" stroke-width="3" rx="8" stroke-dasharray="4 2" />
      <rect x="-40" y="-30" width="30" height="30" fill="#1E293B" stroke="#FF9900" stroke-width="3" rx="4" stroke-dasharray="4 2" />
      <!-- Heavy noise / Blur effect -->
      <rect x="-40" y="0" width="80" height="80" fill="rgba(255,153,0,0.2)" rx="8" />
      <circle cx="0" cy="40" r="30" fill="rgba(255,153,0,0.3)" filter="blur(4px)" />
    </g>

    <!-- State 4: Entering Model -->
    <g class="st4-train">
      <rect x="-40" y="0" width="80" height="80" fill="url(#grad-ai)" stroke="#E879F9" stroke-width="3" rx="16" />
      <!-- AI Chip logic lines -->
      <path d="M-20 40 L-10 40 L0 30 L0 20 M20 40 L10 40 L0 50 L0 60" stroke="#FFF" stroke-width="2" fill="none" opacity="0.6" />
      <circle cx="0" cy="40" r="8" fill="#FFF" />
      <text class="text-small" style="fill:#FFF; font-weight:bold; font-size: 20px;" x="0" y="-10" text-anchor="middle">AI ENGINE</text>
    </g>

    <!-- State 5: Locked Target (x,y) -->
    <g class="st5-lock">
      <rect x="-40" y="0" width="80" height="80" fill="url(#grad-lock)" stroke="#39FF14" stroke-width="4" rx="8" filter="url(#glow-green)" />
      <!-- Large Precision Crosshair -->
      <circle cx="0" cy="40" r="6" fill="#FFF" />
      <line x1="-20" y1="40" x2="20" y2="40" stroke="#FFF" stroke-width="3" />
      <line x1="0" y1="20" x2="0" y2="60" stroke="#FFF" stroke-width="3" />
      <!-- Target Coordinates box -->
      <rect x="-30" y="90" width="60" height="20" fill="#0B0D17" stroke="#39FF14" stroke-width="1" rx="2" />
      <text class="text-small text-green" x="0" y="104" text-anchor="middle" font-size="14">(x,y)</text>
    </g>

  </g>

  <!-- The Factory Stations (Static Background) -->
  <g transform="translate(150, 270)">
    <!-- 1 -->
    <circle class="light l1" cx="0" cy="0" r="5" />
    <text class="text-title" x="0" y="30" text-anchor="middle">76 DRAM STRUCTS</text>
    <text class="text-small" x="0" y="50" text-anchor="middle">Procedural Gen</text>
  </g>

  <g transform="translate(350, 270)">
    <!-- 2 -->
    <circle class="light l2" cx="0" cy="0" r="5" />
    <text class="text-title" x="0" y="30" text-anchor="middle">PAIR SPLITTING</text>
    <text class="text-small" x="0" y="50" text-anchor="middle">Ref 100x + Search 10x</text>
  </g>

  <g transform="translate(550, 270)">
    <!-- 3 -->
    <circle class="light l3" cx="0" cy="0" r="5" />
    <text class="text-title" x="0" y="30" text-anchor="middle">SEM PHYSICS</text>
    <text class="text-small" x="0" y="50" text-anchor="middle">Noise, Blur, Streaks</text>
  </g>

  <g transform="translate(750, 270)">
    <!-- 4 -->
    <circle class="light l4" cx="0" cy="0" r="5" />
    <text class="text-title" x="0" y="30" text-anchor="middle">MODEL TRAINING</text>
    <text class="text-small" x="0" y="50" text-anchor="middle">Siamese ResNet50</text>
  </g>

  <g transform="translate(950, 270)">
    <!-- 5 -->
    <circle class="light l5" cx="0" cy="0" r="5" />
    <text class="text-title" x="0" y="30" text-anchor="middle">LOCALIZATION</text>
    <text class="text-small" x="0" y="50" text-anchor="middle">Precision Lock</text>
  </g>

</svg>
